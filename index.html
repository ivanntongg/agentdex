<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agentdex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: a handheld console. The town screen is the hero; party, dex and box live in a side menu; the event log sits under the screen. Single deliberate night-console theme. */
:root{
  --bg:#211f38;
  --bezel:#2f2c52;
  --bezel-hi:#423e70;
  --slot:#38345f;
  --slot-line:#504b86;
  --ink:#e4e0f2;
  --muted:#a29dc4;
  --paper:#ece8dc;
  --paper-ink:#3a3552;
  --frame-a:#5462a6;
  --frame-b:#9eaad8;
  --spark:#e8c86a;
  --bad:#e0848c;
  --good:#7cc79a;
  --hp-g:#72c07c;--hp-y:#dcb64e;--hp-r:#d8706a;
  --t-code:#5f84c8;--t-research:#55a06e;--t-design:#c96f99;--t-ops:#cc8650;--t-qa:#8a6fc4;--t-write:#b89a4a;
  --font-display:"Silkscreen","Courier New",monospace;
  --font-body:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
img{max-width:100%}
body{font-family:var(--font-body);font-size:16px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:6px 6px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,.tab:focus-visible{outline:2px solid var(--spark);outline-offset:2px}
.pix{clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px),0 4px,2px 4px,2px 2px,4px 2px)}
img.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

.wrap{max-width:1240px;margin:0 auto;display:grid;gap:14px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(26px,4vw,38px);letter-spacing:.04em;color:var(--spark);text-shadow:3px 3px 0 #8a5a3a,5px 5px 0 #191730}
.brand p{margin:0;font-family:var(--font-display);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.hud{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--font-display);font-size:12px;letter-spacing:.06em;padding:6px 10px;background:var(--slot);box-shadow:inset 0 0 0 2px var(--slot-line);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip b{font-weight:700;font-variant-numeric:tabular-nums}
.chip.needs{background:#4a3a10;box-shadow:inset 0 0 0 2px var(--spark);color:var(--spark)}
.chip.mode.live{color:var(--good);box-shadow:inset 0 0 0 2px #4f8f68}
.chip.mode.lost{color:var(--bad)}
.chip.needs.zero{background:var(--slot);box-shadow:inset 0 0 0 2px var(--slot-line);color:var(--muted)}
.dot{width:8px;height:8px;background:currentColor;display:inline-block}

.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:920px){.main{grid-template-columns:minmax(0,1fr)}}

.console{background:var(--bezel);padding:14px;box-shadow:inset 0 0 0 3px var(--bezel-hi),inset 0 -6px 0 rgba(0,0,0,.25);min-width:0}
.screen{position:relative;width:100%;aspect-ratio:3/2;background:#000;container-type:inline-size;box-shadow:0 0 0 4px #0c0b1c}
.screen canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;filter:saturate(.8) contrast(.88) brightness(.96)}
.bl{position:absolute;transform:translate(-50%,-100%);font-family:var(--font-display);font-size:clamp(8px,1.55cqw,13px);letter-spacing:.06em;background:rgba(28,23,51,.86);color:#fff;padding:.25em .55em .3em;pointer-events:none;white-space:nowrap;line-height:1}
.bl small{color:#cfc9f5;font-size:.82em;margin-left:.4em;text-transform:lowercase}
.screen-cap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;font-family:var(--font-display);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

/* dialog box */
.dlg{position:absolute;left:3%;right:3%;bottom:3.5%;background:var(--paper);color:var(--paper-ink);
  box-shadow:inset 0 0 0 .5cqw var(--frame-a),inset 0 0 0 1cqw var(--frame-b),inset 0 0 0 1.3cqw var(--paper);
  padding:2.2cqw 2.8cqw;display:flex;gap:2cqw;align-items:stretch;min-height:21%}
.dlg-text{flex:1;font-size:clamp(13px,2.75cqw,26px);line-height:1.35;min-width:0;cursor:pointer}
.dlg-text .hl{color:#b0371f;font-weight:700}
.dlg-meta{display:block;font-family:var(--font-display);font-size:clamp(8px,1.45cqw,12px);color:#6a6490;letter-spacing:.06em;margin-bottom:.6cqw;text-transform:uppercase}
.dlg-ch{display:flex;flex-direction:column;justify-content:center;gap:.6cqw;padding:1cqw 1.4cqw 1cqw 3.2cqw;background:var(--paper);box-shadow:inset 0 0 0 .4cqw var(--frame-a)}
.dlg-ch button{font-family:var(--font-body);font-weight:700;font-size:clamp(13px,2.6cqw,24px);text-align:left;position:relative;color:var(--paper-ink);padding:.1em .2em;line-height:1.2}
.dlg-ch button.sel::before{content:"";position:absolute;left:-1.1em;top:50%;transform:translateY(-50%);border-left:.55em solid var(--paper-ink);border-top:.35em solid transparent;border-bottom:.35em solid transparent}
.dlg-ch button:focus-visible{outline:2px solid var(--frame-a)}

/* side menu */
.menu{background:var(--bezel);box-shadow:inset 0 0 0 3px var(--bezel-hi);padding:12px;display:grid;gap:12px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{font-family:var(--font-display);font-size:13px;letter-spacing:.08em;padding:9px 4px;background:#1c1940;box-shadow:inset 0 0 0 2px var(--slot-line);color:var(--muted);text-align:center}
.tab[aria-selected="true"]{background:var(--spark);color:#2a1d00;box-shadow:inset 0 0 0 2px #fff3b0}
.pane{display:grid;gap:8px;min-width:0}
.pane-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-display);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:0 2px}

.slot{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;background:var(--slot);box-shadow:inset 0 0 0 2px var(--slot-line)}
.slot:hover{background:#38337a}
.slot.sel{box-shadow:inset 0 0 0 2px var(--spark)}
.slot.needs{background:#3d3214;box-shadow:inset 0 0 0 2px var(--spark)}
.slot.empty{grid-template-columns:1fr;color:var(--muted);font-family:var(--font-display);font-size:11px;letter-spacing:.08em;justify-items:center;padding:14px;background:transparent;box-shadow:inset 0 0 0 2px #3a3574;cursor:default}
.mini{width:44px;height:44px;background:#1c1940;box-shadow:inset 0 0 0 2px #3f3a80;display:grid;place-items:center}
.mini img{width:32px;height:32px}
.r1{display:flex;align-items:center;gap:8px;min-width:0}
.nick{font-weight:700;font-size:17px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{font-family:var(--font-display);font-size:11px;color:var(--muted);white-space:nowrap}
.st{font-family:var(--font-display);font-size:10px;padding:2px 5px;letter-spacing:.06em;color:#fff;margin-left:auto;white-space:nowrap}
.st-OK{display:none}
.st-SLP{background:#5f5c8a}.st-PAR{background:#c99a00;color:#231a00}.st-CNF{background:#c0447c}.st-PSN{background:#7b4bc4}.st-FNT{background:#c8323e}
.hpr{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;margin-top:4px}
.hp-tag{font-family:var(--font-display);font-size:9px;background:#1c1733;color:var(--spark);padding:1px 4px}
.hp-bar{height:7px;background:#1c1733;box-shadow:inset 0 0 0 1px #0f0d22;position:relative}
.hp-bar i{position:absolute;left:1px;top:1px;bottom:1px;display:block;transition:width .4s steps(8)}
.hp-g{background:var(--hp-g)}.hp-y{background:var(--hp-y)}.hp-r{background:var(--hp-r)}
.hp-num{font-family:var(--font-display);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.task{font-size:13.5px;color:#d4cff5;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task em{font-style:normal;color:var(--muted)}

/* summary */
.sum{display:grid;gap:10px}
.back{font-family:var(--font-display);font-size:11px;letter-spacing:.08em;color:var(--muted);justify-self:start;padding:4px 2px}
.back:hover{color:var(--ink)}
.card{background:var(--paper);color:var(--paper-ink);padding:14px;box-shadow:inset 0 0 0 3px var(--frame-a),inset 0 0 0 5px var(--frame-b)}
.sum-top{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center}
.portrait{width:104px;height:104px;background:linear-gradient(#cfe8ff,#eaf5ff 60%,#bfe3a0 60%,#a8d488);box-shadow:inset 0 0 0 2px var(--paper-ink);display:grid;place-items:center}
.portrait img{width:80px;height:80px}
.sum-name{font-weight:700;font-size:22px;line-height:1.1}
.sum-sp{font-family:var(--font-display);font-size:10px;color:#6a6490;letter-spacing:.06em;margin-top:2px}
.types{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.type{font-family:var(--font-display);font-size:10px;letter-spacing:.06em;color:#fff;padding:2px 6px;text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{font-family:var(--font-display);font-size:10px;letter-spacing:.06em;color:#6a6490;padding-top:3px}
.kv dd{margin:0;min-width:0}
.bar2{height:8px;background:#d9d4ea;position:relative;margin-top:4px}
.bar2 i{position:absolute;inset:0 auto 0 0;display:block}
.xp i{background:#4aa3e8}
.cap{font-size:12px;color:#6a6490;margin-top:2px}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mv{background:#fff;box-shadow:inset 0 0 0 2px #d4cfe6;padding:6px 8px;display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:14px}
.mv span{font-family:var(--font-display);font-weight:400;font-size:10px;color:#6a6490;align-self:center;font-variant-numeric:tabular-nums}
.mv.locked{color:#8a84aa}
.memo{font-size:14px;line-height:1.4;color:#3d375c}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--font-display);font-size:11px;letter-spacing:.08em;padding:9px 12px;background:var(--slot);box-shadow:inset 0 0 0 2px var(--slot-line);color:var(--ink)}
.btn:hover{background:#38337a}
.btn.primary{background:var(--spark);color:#2a1d00;box-shadow:inset 0 0 0 2px #fff3b0}
.btn.primary:hover{background:#ffe070}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* dex */
.dexgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dx{background:var(--slot);box-shadow:inset 0 0 0 2px var(--slot-line);padding:8px 4px 6px;display:grid;justify-items:center;gap:2px;position:relative}
.dx img{width:48px;height:48px}
.dx .no{font-family:var(--font-display);font-size:9px;color:var(--muted);letter-spacing:.06em}
.dx .dn{font-family:var(--font-display);font-size:10px;letter-spacing:.04em}
.dx.sel{box-shadow:inset 0 0 0 2px var(--spark)}
.dx .own{position:absolute;top:5px;right:6px;width:9px;height:9px;background:var(--spark);box-shadow:0 0 0 1px #1c1733;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.dx.unk .dn{color:var(--muted)}

/* box */
.boxgrid{display:grid;gap:8px}
.boxnote{font-size:14px;color:var(--muted);padding:2px}

/* log */
.log{margin-top:12px;background:#110f26;box-shadow:inset 0 0 0 2px #2c2860;padding:10px 12px;display:grid;gap:4px;max-height:212px;overflow:auto}
.log-h{display:flex;justify-content:space-between;font-family:var(--font-display);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:4px;gap:8px;flex-wrap:wrap}
.ev{display:grid;grid-template-columns:46px minmax(0,1fr);gap:8px;font-size:14px;line-height:1.35}
.ev time{font-family:var(--font-display);font-size:10px;color:#6f69a3;padding-top:3px;font-variant-numeric:tabular-nums}
.ev.need span{color:var(--spark)}
.ev.bad span{color:#ff8e98}
.ev.ok span{color:#9ee6b6}
.ev.lvl span{color:#9fc2ff}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.key span{display:flex;align-items:center;gap:6px}
.pausebtn{font-family:var(--font-display);font-size:10px;letter-spacing:.08em;color:var(--muted)}
.pausebtn:hover{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){.moves{grid-template-columns:1fr}.sum-top{grid-template-columns:80px minmax(0,1fr)}.portrait{width:80px;height:80px}.portrait img{width:64px;height:64px}}
@media (prefers-reduced-motion:reduce){.hp-bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>AGENTDEX</h1>
      <p>Your agents, out in the field</p>
    </div>
    <div class="hud" aria-live="polite">
      <span class="chip" style="color:var(--good)"><span class="dot"></span><b id="cWork">0</b> WORKING</span>
      <span class="chip"><span class="dot" style="color:#8f8bc0"></span><b id="cIdle">0</b> IDLE</span>
      <span class="chip mode" id="mode" title="Demo runs in your browser. Live follows the Agentdex server.">DEMO</span>
      <button class="chip needs" id="cNeeds"><b id="cNeedN">0</b> NEED YOU</button>
      <span class="chip"><span id="clock">DAY 1 09:41</span></span>
    </div>
  </header>

  <div class="main">
    <section class="console pix" aria-label="Town">
      <div class="screen" id="screen">
        <canvas id="cv" width="240" height="160" aria-label="Pixel town where your agents walk between buildings"></canvas>
        <div id="labels"></div>
        <div class="dlg" id="dlg" hidden role="dialog" aria-live="assertive" aria-label="Request">
          <div class="dlg-text" id="dlgText"></div>
          <div class="dlg-ch" id="dlgCh"></div>
        </div>
      </div>
      <div class="screen-cap"><span>Walk: arrow keys, WASD or tap the map. Z near an agent to pet or poke. Z = YES, X = NO.</span><button class="pausebtn" id="pause">PAUSE TIME</button></div>
      <div class="log">
        <div class="log-h"><span>Field log</span><span>Every move on the map is a real event</span></div>
        <div id="log"></div>
      </div>
      <div class="key">
        <span><b class="st st-SLP" style="margin:0">SLP</b> idle</span>
        <span><b class="st st-PAR" style="margin:0">PAR</b> waiting on you</span>
        <span><b class="st st-CNF" style="margin:0">CNF</b> looping</span>
        <span><b class="st st-PSN" style="margin:0">PSN</b> burning budget</span>
        <span><b class="st st-FNT" style="margin:0">FNT</b> run failed</span>
        <span><b class="hp-tag">HP</b> context left</span>
      </div>
    </section>

    <aside class="menu pix" aria-label="Menu">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="t-party" aria-selected="true">PARTY</button>
        <button class="tab" role="tab" id="t-dex" aria-selected="false">DEX</button>
        <button class="tab" role="tab" id="t-box" aria-selected="false">BOX</button>
      </div>
      <div class="pane" id="pane"></div>
    </aside>
  </div>
</div>

<script>
(()=>{
const W=240,H=160,UP=72,LO=152,CX=120;
const K='#2b2645';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TYPES={CODE:'var(--t-code)',RESEARCH:'var(--t-research)',DESIGN:'var(--t-design)',OPS:'var(--t-ops)',QA:'var(--t-qa)',WRITE:'var(--t-write)'};

/* ---------- sprites: left halves, mirrored ---------- */
const mir=r=>r.map(s=>s+[...s].reverse().join(''));
const SPR={
bytle:mir(["........","..k.....","...k....","....k...","....kkkk","...k3333","..k3wk33","..k33333",".kkkkkkk",".k1h111k","k11h111k","k111111k","k211111k",".k22111k",".kkkkkkk","..k..k.."]),
bytlord:mir(["........","....3..3","....3333","....kkkk","....kkkk","...k3333","..k3wk33","..k33333",".kkkkkkk",".k1h111k","k11h111k","k111111k","k211111k",".k22111k",".kkkkkkk","..k..k.."]),
quillow:mir(["........","..kk....","..k1k...","..k11kkk","..k11111",".k1www11",".k1wkw13",".k1www13",".k111111","k12hh111","k12hhhh1","k12hhhh1","k122hhh1",".k221111","..kk3kkk","...3.3.."]),
fennook:mir([".k......",".kk.....",".k1k....",".k31k...",".k331kkk",".k111111","k1111111","k1kw1111","k1kk1111",".k1111hh","..k111hk","...kkkkk","..k2111h","..k2111h","..kk1kkk","...k.k.."]),
chromoth:mir(["........","...k....","....k...","kk...k..","k3k..kkk","k33kkk11","k3h33kwk","k3333k11","k33h3k11",".k333k11","..kkkk11",".k333k11","k3h33k11",".k33kk2k","..kk..k.","........"]),
gearbo:mir(["........",".......k","......k3","..kkkkkk",".k333333",".k3kkkkk",".k3kkwkk",".k3kkkkk",".k333333","kk222222","k1k1k1k1","k1111111","k1k1k1k1","k2222222",".kkkkkkk",".k3k..k3"]),
sentril:mir(["...k.k..","..k3k3k.",".k333333","k3333333","k33kkkkk","k3k11111","k3k1wk11","k3k1kk11","k3k11111",".k3k111k",".k3k11h1","..kk2111","..k22111","..k21111","...kk.kk","........"]),
egg:mir(["........","........","......kk",".....k11","....k111","...k1111","...k1111","..k11111","..k11111","..k11111","..k11111","..k11111","...k1111","....k111",".....kkk","........"])
};
const PAL={
bytle:{1:'#5b8de6',2:'#3a5fb0',3:'#24366e',h:'#b4d0ff',w:'#fff'},
bytlord:{1:'#3f6fd0',2:'#2a4c98',3:'#e8b830',h:'#b4d0ff',w:'#fff'},
quillow:{1:'#c9a233',2:'#8f6f1c',3:'#e8693a',h:'#f6e7b8',w:'#fff'},
fennook:{1:'#4fb06c',2:'#2f7a47',3:'#f2a8c2',h:'#eaf6e2',w:'#fff'},
chromoth:{1:'#6e5290',2:'#4a3460',3:'#ef6fa8',h:'#ffd6ea',w:'#fff'},
gearbo:{1:'#e0843a',2:'#a85a22',3:'#a9b2c6',h:'#ffd2a8',w:'#7ff0ff'},
sentril:{1:'#f0dcc0',2:'#c9a882',3:'#8d63d6',h:'#fff6e8',w:'#fff'},
egg:{1:'#3a3560',2:'#3a3560',3:'#3a3560',h:'#3a3560',w:'#3a3560'}
};
const sprCache={};
function sprite(key,mode=''){
  const id=key+mode; if(sprCache[id])return sprCache[id];
  const c=document.createElement('canvas');c.width=16;c.height=16;const x=c.getContext('2d');
  const rows=SPR[key],p=PAL[key];
  rows.forEach((r,y)=>[...r].forEach((ch,i)=>{if(ch==='.')return;let col=ch==='k'?K:p[ch];
    if(mode==='sil')col='#2a2650';
    if(mode==='white')col='#ffffff';
    if(mode==='gray'){col=ch==='k'?'#2a2840':'#8e8aa6'}
    x.fillStyle=col;x.fillRect(i,y,1,1)}));
  sprCache[id]=c;return c;
}
/* ---------- you: the professor ---------- */
const PROF_HEAD={

function moveMe(dx,dy){
  if(!dx&&!dy){me.moving=false;return false}
  const l=Math.hypot(dx,dy),sp=1.05;dx=dx/l*sp;dy=dy/l*sp;
  me.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');
  let moved=false;
  if(!blocked(me.x+dx,me.y)){me.x+=dx;moved=true}
  if(!blocked(me.x,me.y+dy)){me.y+=dy;moved=true}
  me.moving=moved;return moved;
}

  if(dx||dy){me.target=null;me.follow=null;moveMe(dx,dy);return}

/* ---------- simulation ---------- */
function tick(){
  if(paused||LIVE)return;
  clock++;if(clock>=24*60){clock=0;day++}
  for(const a of party){
    if(a.path.length)continue;
    const s=SPEC[a.sp];
    if(a.status==='FNT'){a.faintT=(a.faintT||0)+1;if(a.faintT===3){log(`${a.nick} is being carried to the CENTER.`,'bad');goTo(a,'CENTER','heal')}continue}
    if(a.status==='CNF'){if(--a.cnfT<=0){a.status='OK';log(`${a.nick} snapped out of it and tried a different approach.`,'ok')}continue}
    if(a.phase==='idle'){
      if(s.reviewer){if(!a.reviewing)a.status='SLP';continue}
      if(Math.random()<0.2)startTask(a);
      else if(Math.random()<0.015&&a.loc!=='MART')goTo(a,'MART','learn');
    }else if(a.phase==='work'||a.phase==='review'){
      a.workLeft--;
      const drain=(3+Math.random()*5)*(a.status==='PSN'?2.6:1);
      a.hp=Math.max(0,Math.round(a.hp-drain));
      const mv=pick(a.moves.slice(0,3));if(mv.pp>0)mv.pp--;
      if(a.hp<=0){faint(a);continue}
      if(a.phase==='work'&&a.status==='OK'){
        if(Math.random()<0.035){a.status='CNF';a.cnfT=4;log(`${a.nick} is confused! It ran the same ${mv.n.toLowerCase()} 3 times in a row.`,'bad');continue}
        if(Math.random()<0.03){a.status='PSN';log(`${a.nick} is poisoned! It's spending tokens 2.6x faster than usual.`,'bad')}
      }
      if(a.workLeft<=0)workDone(a);
    }
  }
  refresh();
}

    return;
  }
  $('#reset').onclick=()=>{if(a.reviewing)return;const r=party.find(x=>x.reviewing===a.id);if(r)r.reviewing=null;
    a.task=null;a.status='OK';log(`You sent ${a.nick} to the CENTER for a reset.`);goTo(a,'CENTER','heal');renderPane()};
  $('#tobox').onclick=()=>{
    const i=party.indexOf(a);party.splice(i,1);
    const r=party.find(x=>x.reviewing===a.id);if(r){r.reviewing=null;r.status='SLP'}
    if(a.reviewing){const t=byId(a.reviewing);a.reviewing=null}
    a.task=null;a.phase='idle';a.status='SLP';a.path=[];box.push(a);
    for(let j=queue.length-1;j>=0;j--)if(queue[j].id===a.id&&queue[j]!==current)queue.splice(j,1);
    log(`${a.nick} went into the BOX. It stops running and costs nothing.`);selId=null;view='list';renderPane()};
}
function addToParty(a){
  const used=new Set(party.map(x=>x.slot));let s=0;while(used.has(s))s++;a.slot=s;
  party.push(a);place(a,'CENTER');a.status='SLP';a.phase='idle';a.path=[];
}
function spawn(k){
  if(party.length>=6)return;
  if(LIVE){api('api/agents',{species:k}).then(r=>{if(r&&r.agent){selId=r.agent.id;tab='party';view='list';renderPane()}});return}
  const a=mkAgent(k,null,5);addToParty(a);
  fx.push({type:'spawn',id:a.id,t:0});
  log(`You spawned ${SPEC[k].name} at the CENTER! It joined your party at Lv 5.`,'ok');
  selId=a.id;tab='party';view='list';renderPane();
}
['party','dex','box'].forEach(t=>$('#t-'+t).onclick=()=>{tab=t;if(t==='party')view='list';renderPane()});

function renderLog(){
  $('#log').innerHTML=logs.map(l=>`<div class="ev ${l.cls}"><time>${l.t}</time><span>${esc(l.msg)}</span></div>`).join('');
}
function refresh(){
  const work=party.filter(a=>a.task&&a.status!=='FNT'||a.reviewing).length;
  const idle=party.filter(a=>a.phase==='idle'&&!a.reviewing&&a.status==='SLP').length;
  $('#cWork').textContent=work;$('#cIdle').textContent=idle;
  const needs=queue.filter(q=>q.kind!=='act').length;
  $('#cNeedN').textContent=needs;$('#cNeeds').classList.toggle('zero',!needs);
  $('#clock').textContent=`DAY ${day} ${hhmm()}`;
  if(tab!=='dex')renderPane();
}

/* ---------- demo mode: everything simulated in the browser ---------- */
function startDemo(){
log('Good morning, Professor. 5 agents in your party, 1 in the box.');
log('Walk up to an agent and press Z (or tap it) to pet, poke or check on it.');
const patch=party[0],rollo=party[3],scout=party[1];
patch.task={t:'Fix flaky checkout test',review:1,ap:{m:'MERGE',on:'PR #212 into main'}};patch.status='OK';patch.phase='work';patch.workLeft=3;
scout.task={t:'Compare 4 vector databases'};scout.status='OK';goTo(scout,'LAB','work');
rollo.task={t:'Deploy api v2.3',ap:{m:'DEPLOY',on:'api-prod'}};rollo.status='PAR';rollo.phase='wait';
queue.push({kind:'ap',id:rollo.id});
log('ROLLO needs you: it wants to use DEPLOY on api-prod.','need');
renderPane();refresh();
setTimeout(showDialog,600);
setInterval(tick,1300);
}
/* ---------- live mode: the Agentdex server is the source of truth ---------- */
let TOKEN=null;
try{const q=new URLSearchParams(location.search).get('token');if(q)localStorage.setItem('agentdex-token',q);TOKEN=localStorage.getItem('agentdex-token')}catch{}
async function api(path,body){
  try{
    const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json',...(TOKEN?{authorization:'Bearer '+TOKEN}:{})},body:JSON.stringify(body||{})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){log(r.status===401?'The server needs a token. Open the page with ?token=YOUR_TOKEN once.':(j.error||'The server refused that.'),'bad');return null}
    return j;
  }catch{log('Could not reach the Agentdex server.','bad');return null}
}
const evTime=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const toTask=t=>t?{t:t.title,review:t.review?1:0,ap:t.approval?{m:t.approval.tool,on:t.approval.target}:undefined}:null;
function syncAgent(sa){
  let a=party.find(x=>x.id===sa.id)||box.find(x=>x.id===sa.id);
  if(!a)a={id:sa.id,path:[],x:0,y:0,slot:0};
  Object.assign(a,{sp:sa.species,nick:sa.nick,lv:sa.lv,xp:sa.xp,hp:sa.hp,hpMax:sa.hpMax,status:sa.status,phase:sa.phase,
    task:toTask(sa.task),moves:sa.moves,friend:sa.bond,reviewing:sa.reviewingId,workLeft:0});
  seen.add(sa.species);
  const pi=party.indexOf(a),bi=box.indexOf(a);
  if(sa.boxed){if(pi>=0)party.splice(pi,1);if(bi<0)box.push(a);a.path=[];a.loc=a.dest=sa.loc;return a}
  if(bi>=0)box.splice(bi,1);
  if(pi<0){const used=new Set(party.map(x=>x.slot));let s=0;while(used.has(s))s++;a.slot=s;party.push(a);a.path=[];place(a,sa.loc);a.dest=sa.loc;return a}
  if(sa.loc!==(a.dest||a.loc))goTo(a,sa.loc,'live');
  return a;
}
function syncApprovals(list){
  const keep=queue.filter(q=>q.kind==='act'||list.some(s=>s.id===q.apId));
  for(const s of list)if(!keep.some(q=>q.apId===s.id))keep.push({kind:s.kind==='tool'?'ap':'evo',id:s.agentId,apId:s.id,tool:s.tool,target:s.target,taskTitle:s.taskTitle});
  queue.length=0;queue.push(...keep);
  if(current&&current.apId&&!list.some(s=>s.id===current.apId)){clearInterval(typing);typing=null;current=null;$('#dlg').hidden=true}
  showDialog();
}
function addLog(ev){logs.unshift({t:evTime(ev.ts),msg:ev.message,cls:ev.tone==='info'?'':ev.tone});if(logs.length>60)logs.pop()}
function hydrate(s){
  const ids=new Set(s.agents.map(a=>a.id));
  for(const list of [party,box])for(let i=list.length-1;i>=0;i--)if(!ids.has(list[i].id))list.splice(i,1);
  s.agents.forEach(syncAgent);
  logs.length=0;s.log.slice().reverse().forEach(addLog);renderLog();
  if(selId&&!byId(selId))selId=null;
  syncApprovals(s.approvals);
  setMode('live');renderPane();refresh();
}
function onChange(p){
  const ev=p.event;
  p.agents.forEach(syncAgent);
  if(ev.type==='agent.spawned'||ev.type==='agent.unboxed'){const a=byId(ev.agentId);if(a)fx.push({type:'spawn',id:a.id,t:0})}
  if(ev.type==='approval.resolved'&&ev.data.kind==='evolve'&&ev.data.to&&!fx.some(f=>f.type==='evo'&&f.id===ev.agentId))fx.push({type:'evo',id:ev.agentId,t:0});
  if(ev.message){addLog(ev);renderLog()}
  syncApprovals(p.approvals);
  refresh();
}
function setMode(m){const el=$('#mode');el.textContent=m==='live'?'LIVE':m==='lost'?'RECONNECTING':'DEMO';el.className='chip mode '+(m==='demo'?'':m)}
function nowClock(){const d=new Date();clock=d.getHours()*60+d.getMinutes()}
function startLive(s){
  LIVE=true;nowClock();setInterval(()=>{nowClock();refresh()},15000);
  party.length=0;box.length=0;queue.length=0;
  hydrate(s);
  log(s.adapter==='simulator'?'Connected to the Agentdex server. The simulator is driving the agents.':'Connected to the Agentdex server. Waiting for your agents to report in.','ok');
  log('Walk up to an agent and press Z (or tap it) to pet, poke or check on it.');
  const es=new EventSource('api/events');
  es.addEventListener('snapshot',e=>hydrate(JSON.parse(e.data)));
  es.addEventListener('change',e=>onChange(JSON.parse(e.data)));
  es.onerror=()=>setMode('lost');
}
async function boot(){
  requestAnimationFrame(draw);
  if(/^https?:$/.test(location.protocol)){
    try{
      const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),1500);
      const r=await fetch('api/state',{signal:ctl.signal,cache:'no-store'});clearTimeout(tm);
      if(r.ok&&(r.headers.get('content-type')||'').includes('json')){startLive(await r.json());return}
    }catch{}
  }
  startDemo();
}
boot();
})();
