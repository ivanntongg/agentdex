name: Publish to npm

# Publishes agentdex-town to npm when you publish a GitHub release.
# Uses npm trusted publishing: no token to store. One-time setup on npmjs.com:
# package agentdex-town > Settings > Trusted publisher > GitHub Actions,
# owner ivanntongg, repository agentdex, workflow publish.yml.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
